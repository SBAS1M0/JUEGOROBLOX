# Lista mínima de globales de Roblox para que selene pueda analizar el código
# sin descargar la definición completa de la API.
---
base: luau
name: roblox_min
globals:
  game:
    any: true
  workspace:
    any: true
  script:
    any: true
  Instance:
    any: true
  Vector3:
    any: true
  Vector2:
    any: true
  Content:
    any: true
  buffer:
    any: true
  CFrame:
    any: true
  Color3:
    any: true
  UDim:
    any: true
  UDim2:
    any: true
  Enum:
    any: true
  TweenInfo:
    any: true
  NumberSequence:
    any: true
  NumberSequenceKeypoint:
    any: true
  ColorSequence:
    any: true
  ColorSequenceKeypoint:
    any: true
  NumberRange:
    any: true
  Random:
    any: true
  task:
    any: true
  warn:
    any: true
  typeof:
    any: true
  math.clamp:
    args:
      - type: number
      - type: number
      - type: number
